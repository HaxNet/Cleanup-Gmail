<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Cleanup Gmail">
  <title>Cleanup Gmail (16px)</title>
  <!-- Pixel-grid tuned variant of logo.svg for toolbar-size rendering.
       Bars snap to whole pixels so they stay crisp at 16x16. -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" ry="3.5" fill="#111111"/>
  <rect x="0.5" y="0.5" width="15" height="15" rx="3" ry="3"
        fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1"/>
  <g fill="#ffffff">
    <rect x="4" y="4"  width="9" height="2" rx="1" ry="1"/>
    <rect x="4" y="7"  width="6" height="2" rx="1" ry="1" fill-opacity="0.9"/>
    <rect x="4" y="10" width="4" height="2" rx="1" ry="1" fill-opacity="0.6"/>
  </g>
</svg>
